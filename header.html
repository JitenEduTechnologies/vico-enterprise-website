<style>
/* =========================================================
   VYNTRA MASTER HEADER STYLES (ENTERPRISE DESIGN SYSTEM)
   ========================================================= */
:root {
  --vyntra-teal: #087F73;
  --vyntra-teal-dark: #05665D;
  --vyntra-text: #111111;
  --vyntra-muted: #5F6B76;
  --vyntra-bg: #F7FAFA;
  --vyntra-white: #FFFFFF;
  --vyntra-light-teal: #EAF6F4;
  --vyntra-coral: #F36F61;
  --vyntra-border: #E1E7E6;
}
.site-header {
  position: fixed;
  z-index: 1000;
  inset: 0 0 auto;
  height: 66px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--vyntra-border);
  box-shadow: 0 2px 12px rgba(17, 17, 17, 0.04);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform;
  transform: translateY(0);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.site-header.is-hidden {
  transform: translateY(-110%);
}
.header-inner {
  height: 100%;
  width: min(1280px, calc(100% - 48px));
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
@media (max-width: 768px) {
  .header-inner {
    width: min(1280px, calc(100% - 32px));
  }
}
@media (max-width: 480px) {
  .header-inner {
    width: min(1280px, calc(100% - 24px));
  }
}
/* BRAND */
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--vyntra-text);
  flex: none;
  text-decoration: none;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--vyntra-coral);
  position: relative;
  transform: rotate(-8deg);
  flex-shrink: 0;
}
.brand-mark:after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 3px solid #fff;
  border-left-color: transparent;
  border-radius: 50%;
  left: 6px;
  top: 5px;
}
.brand-mark:before {
  content: "";
  position: absolute;
  width: 7px;
  height: 3px;
  background: #fff;
  right: 4px;
  bottom: 6px;
  transform: rotate(-35deg);
}
.brand-word {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--vyntra-text);
}
/* DESKTOP NAVIGATION */
.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-left: auto;
  margin-right: 12px;
}
.nav a {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--vyntra-muted);
  padding: 8px 12px;
  border-radius: 8px;
  white-space: nowrap;
  text-decoration: none;
  transition: color 0.15s ease, background 0.15s ease;
}
.nav a:hover {
  color: var(--vyntra-teal);
  background: var(--vyntra-light-teal);
}
.nav a.active {
  color: var(--vyntra-teal);
  font-weight: 600;
  background: var(--vyntra-light-teal);
}
/* HEADER CTA BUTTON */
.header-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--vyntra-teal);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  text-decoration: none;
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 8px rgba(8, 127, 115, 0.2);
  flex-shrink: 0;
}
.header-cta:hover {
  transform: translateY(-1px);
  background: var(--vyntra-teal-dark);
  box-shadow: 0 4px 14px rgba(8, 127, 115, 0.28);
}
/* MOBILE MENU BUTTON */
.menu-btn {
  display: none;
  margin-left: auto;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  border: 1px solid var(--vyntra-border);
  background: var(--vyntra-bg);
  color: var(--vyntra-text);
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
  align-items: center;
  justify-content: center;
}
@media(max-width:1200px) {
  .nav { gap: 2px; }
  .nav a { font-size: 12.5px; padding: 6px 8px; }
  .header-cta { padding: 0 14px; font-size: 12px; min-height: 38px; }
}
@media(max-width:980px) {
  .nav { gap: 1px; }
  .nav a { font-size: 11.5px; padding: 5px 6px; }
  .header-cta { padding: 0 12px; font-size: 11.5px; min-height: 36px; }
}
/* MOBILE NAVIGATION */
@media(max-width:920px) {
  .header-inner { width: calc(100% - 32px); }
  .nav, .header-cta { display: none; }
  .menu-btn { display: flex; }
  .nav.open {
    display: flex;
    position: absolute;
    top: 66px;
    left: 16px;
    right: 16px;
    flex-direction: column;
    gap: 4px;
    background: #ffffff;
    border: 1px solid var(--vyntra-border);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 12px 36px rgba(17, 17, 17, 0.12);
  }
  .nav.open a {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    padding: 10px 14px;
    font-size: 14.5px;
    font-weight: 500;
    border-radius: 8px;
    color: var(--vyntra-text);
  }
  .nav.open a:hover,
  .nav.open a.active {
    background: var(--vyntra-light-teal);
    color: var(--vyntra-teal);
    font-weight: 600;
  }
  .nav.open .mobile-cta {
    margin-top: 8px;
    padding: 12px 14px;
    background: var(--vyntra-teal);
    color: #ffffff;
    font-weight: 600;
    justify-content: center;
    text-align: center;
  }
  .nav.open .mobile-cta:hover {
    background: var(--vyntra-teal-dark);
    color: #ffffff;
  }
}
@media(max-width:600px) {
  .site-header { height: 60px; }
  .nav.open { top: 60px; }
  .brand-word { font-size: 19px; }
  .brand-mark { width: 26px; height: 26px; }
}
@media(prefers-reduced-motion:reduce) {
  .site-header { transition: transform 0.01s linear!important; }
}
</style>

  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="Vyntra home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word" data-site-brand>Vyntra</span>
    </a>
    <nav class="nav" id="mainNav" aria-label="Primary navigation">
      <a href="index.html" data-nav="index.html">Home</a>
      <a href="1-vico-solutions.html" data-nav="1-vico-solutions.html">Solutions</a>
      <a href="services.html" data-nav="services.html">Services</a>
      <a href="our-products.html" data-nav="our-products.html">Our Products</a>
      <a href="industries.html" data-nav="industries.html">Industries</a>
      <a href="careers.html" data-nav="careers.html">SAP Careers</a>
      <a href="contact.html" data-nav="contact.html">Contact Us</a>
    </nav>
    <a class="header-cta" href="contact.html#contact-form" data-site-form-link data-site-contact>
      Contact Us
    </a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false">
      ☰
    </button>
  </div>
</header>
