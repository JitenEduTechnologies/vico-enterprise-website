<style>
/* =========================================================
   VYNTRA MASTER HEADER STYLES (ENTERPRISE DESIGN SYSTEM)
   ========================================================= */
:root {
  --vyntra-teal: #087F73;
  --vyntra-teal-dark: #05665D;
  --vyntra-text: #111111;
  --vyntra-muted: #5F6B76;
  --vyntra-bg: #F7FAFA;
  --vyntra-white: #FFFFFF;
  --vyntra-light-teal: #EAF6F4;
  --vyntra-coral: #F36F61;
  --vyntra-border: #E1E7E6;
}
.site-header {
  position: fixed;
  z-index: 1000;
  inset: 0 0 auto;
  height: 66px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--vyntra-border);
  box-shadow: 0 2px 12px rgba(17, 17, 17, 0.04);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform;
  transform: translateY(0);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.site-header.is-hidden {
  transform: translateY(-110%);
}
.header-inner {
  height: 100%;
  width: min(1280px, calc(100% - 48px));
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
@media (max-width: 768px) {
  .header-inner {
    width: min(1280px, calc(100% - 32px));
  }
}
@media (max-width: 480px) {
  .header-inner {
    width: min(1280px, calc(100% - 24px));
  }
}
/* BRAND */
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--vyntra-text);
  flex: none;
  text-decoration: none;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--vyntra-coral);
  position: relative;
  transform: rotate(-8deg);
  flex-shrink: 0;
}
.brand-mark:after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 3px solid #fff;
  border-left-color: transparent;
  border-radius: 50%;
  left: 6px;
  top: 5px;
}
.brand-mark:before {
  content: "";
  position: absolute;
  width: 7px;
  height: 3px;
  background: #fff;
  right: 4px;
  bottom: 6px;
  transform: rotate(-35deg);
}
.brand-word {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--vyntra-text);
}
/* DESKTOP NAVIGATION (> 1024px) */
.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-left: auto;
  margin-right: 12px;
}
.nav a {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--vyntra-muted);
  padding: 8px 12px;
  border-radius: 8px;
  white-space: nowrap;
  text-decoration: none;
  transition: color 0.15s ease, background 0.15s ease;
}
.nav a:hover {
  color: var(--vyntra-teal);
  background: var(--vyntra-light-teal);
}
.nav a.active {
  color: var(--vyntra-teal);
  font-weight: 600;
  background: var(--vyntra-light-teal);
}
.nav .mobile-cta {
  display: none;
}
/* HEADER CTA BUTTON */
.header-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--vyntra-teal);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  text-decoration: none;
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 8px rgba(8, 127, 115, 0.2);
  flex-shrink: 0;
}
.header-cta:hover {
  transform: translateY(-1px);
  background: var(--vyntra-teal-dark);
  box-shadow: 0 4px 14px rgba(8, 127, 115, 0.28);
}
/* MOBILE / TABLET MENU BUTTON */
.menu-btn {
  display: none;
  margin-left: auto;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 10px;
  border: 1px solid var(--vyntra-border);
  background: var(--vyntra-bg);
  color: var(--vyntra-text);
  cursor: pointer;
  font-size: 22px;
  line-height: 1;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1002;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
}
.menu-btn:hover {
  background: var(--vyntra-light-teal);
  border-color: rgba(8, 127, 115, 0.3);
}
.menu-btn:active {
  transform: scale(0.96);
}
.menu-btn[aria-expanded="true"],
.menu-btn.is-active {
  background: var(--vyntra-light-teal);
  border-color: rgba(8, 127, 115, 0.4);
  color: var(--vyntra-teal);
}

/* BACKDROP OVERLAY */
.menu-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 998;
  opacity: 0;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.menu-backdrop.open {
  display: block;
  opacity: 1;
  pointer-events: auto;
}

/* PREVENT BACKGROUND SCROLL WHEN MENU IS OPEN */
html.menu-open,
body.menu-open {
  overflow: hidden !important;
  overscroll-behavior: none !important;
  touch-action: none;
}

.nav-drawer-header {
  display: none;
}

@media(min-width: 1025px) {
  .menu-btn { display: none !important; }
  .nav-drawer-header { display: none !important; }
  .menu-backdrop { display: none !important; }
}

@media(max-width:1200px) and (min-width:1025px) {
  .nav { gap: 2px; }
  .nav a { font-size: 12.5px; padding: 6px 8px; }
  .header-cta { padding: 0 14px; font-size: 12px; min-height: 38px; }
}

/* RESPONSIVE DRAWER FOR TABLET & MOBILE (<= 1024px) */
@media(max-width:1024px) {
  .header-inner { width: calc(100% - 32px); }
  .header-cta { display: none; }
  .menu-btn { display: flex; }
  
  .nav-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 4px 12px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--vyntra-border);
    flex-shrink: 0;
  }
  .nav-drawer-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--vyntra-muted);
  }
  .nav-close-btn {
    width: 36px;
    height: 36px;
    min-width: 36px;
    min-height: 36px;
    border-radius: 8px;
    border: 1px solid var(--vyntra-border);
    background: var(--vyntra-bg);
    color: var(--vyntra-text);
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .nav-close-btn:hover {
    background: var(--vyntra-light-teal);
    color: var(--vyntra-teal);
    border-color: rgba(8, 127, 115, 0.3);
  }
  .nav-close-btn:active {
    transform: scale(0.95);
  }

  .nav {
    position: fixed;
    top: 66px;
    right: 0;
    left: auto;
    width: min(340px, calc(100vw - 32px));
    height: calc(100vh - 66px);
    height: calc(100dvh - 66px);
    max-height: calc(100dvh - 66px);
    background: #ffffff;
    border-left: 1px solid var(--vyntra-border);
    box-shadow: -12px 0 36px rgba(17, 17, 17, 0.14);
    display: flex;
    flex-direction: column;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    gap: 4px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    transform: translateX(110%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s ease;
    visibility: hidden;
    z-index: 1001;
    margin: 0;
    box-sizing: border-box;
  }
  .nav.open {
    transform: translateX(0);
    visibility: visible;
  }
  .nav a {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    font-size: 14.5px;
    font-weight: 500;
    border-radius: 10px;
    color: var(--vyntra-text);
    box-sizing: border-box;
    text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .nav a:hover,
  .nav a.active {
    background: var(--vyntra-light-teal);
    color: var(--vyntra-teal);
    font-weight: 600;
  }
  .nav .mobile-cta {
    display: block;
    margin-top: auto;
    padding-top: 14px;
    width: 100%;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .nav .mobile-cta a {
    min-height: 46px;
    background: var(--vyntra-teal);
    color: #ffffff !important;
    font-weight: 600;
    font-size: 14px;
    justify-content: center;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(8, 127, 115, 0.22);
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }
  .nav .mobile-cta a:hover {
    background: var(--vyntra-teal-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(8, 127, 115, 0.3);
  }
}
@media(max-width:600px) {
  .site-header { height: 60px; }
  .header-inner { width: calc(100% - 24px); }
  .nav {
    top: 60px;
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);
    max-height: calc(100dvh - 60px);
    width: min(320px, calc(100vw - 20px));
    padding: 14px 14px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .brand-word { font-size: 19px; }
  .brand-mark { width: 26px; height: 26px; }
}
@media(max-width:380px) {
  .nav {
    width: min(300px, calc(100vw - 16px));
    padding: 12px 12px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .nav a {
    font-size: 14px;
    padding: 9px 12px;
    min-height: 42px;
  }
}
@media(prefers-reduced-motion:reduce) {
  .site-header, .nav, .menu-backdrop { transition: none !important; }
}
</style>

  </div>
</header>
