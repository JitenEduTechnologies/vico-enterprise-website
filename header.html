<style>
/* =========================================================
VICO MASTER HEADER STYLES (LIGHT THEME)
========================================================= */
.site-header {
position: fixed;
z-index: 1000;
inset: 0 0 auto;
height: 76px;
background: rgba(255, 255, 255, .88);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(0, 0, 0, .08);
box-shadow: 0 4px 20px rgba(0, 0, 0, .03);
transition: transform .42s cubic-bezier(.2, .8, .2, 1);
will-change: transform;
transform: translateY(0);
}
.site-header.is-hidden {
transform: translateY(-110%);
}
.header-inner {
height: 100%;
width: min(1420px, calc(100% - 48px));
margin: auto;
display: flex;
align-items: center;
gap: 30px;
}
/* BRAND */
.brand {
display: flex;
align-items: center;
gap: 10px;
color: #111827;
flex: none;
text-decoration: none;
}
.brand-mark {
width: 35px;
height: 35px;
border-radius: 11px;
background: #f26b5b;
position: relative;
transform: rotate(-8deg);
}
.brand-mark:after {
content: "";
position: absolute;
width: 15px;
height: 15px;
border: 4px solid #fff;
border-left-color: transparent;
border-radius: 50%;
left: 8px;
top: 6px;
}
.brand-mark:before {
content: "";
position: absolute;
width: 10px;
height: 4px;
background: #fff;
right: 5px;
bottom: 7px;
transform: rotate(-35deg);
}
.brand-word {
font-size: 27px;
font-weight: 850;
letter-spacing: -.07em;
color: #111827;
}
/* DESKTOP NAVIGATION */
.nav {
display: flex;
align-items: center;
justify-content: center;
gap: 20px;
margin-left: auto;
}
.nav a {
font-size: 13px;
font-weight: 720;
color: #374151;
white-space: nowrap;
text-decoration: none;
transition: color .25s ease;
}
.nav a:hover,
.nav a.active {
color: #087b70;
}
/* HEADER CTA */
.header-cta {
padding: 12px 20px;
border: 1px solid transparent;
border-radius: 999px;
background: #087b70;
color: #fff;
font-size: 12px;
font-weight: 850;
letter-spacing: .05em;
white-space: nowrap;
text-decoration: none;
transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
box-shadow: 0 4px 14px rgba(8, 123, 112, .25);
}
.header-cta:hover {
transform: translateY(-1px);
background: #06665d;
box-shadow: 0 6px 18px rgba(8, 123, 112, .35);
}
/* MOBILE BUTTON */
.menu-btn {
display: none;
margin-left: auto;
width: 44px;
height: 44px;
border-radius: 50%;
border: 1px solid rgba(0, 0, 0, .12);
background: rgba(0, 0, 0, .04);
color: #111827;
cursor: pointer;
font-size: 20px;
line-height: 1;
align-items: center;
justify-content: center;
}
@media(max-width:1120px) {
.nav { gap: 14px; }
.nav a { font-size: 11px; }
.header-cta { padding: 10px 14px; font-size: 11px; }
}
/* MOBILE NAVIGATION */
@media(max-width:920px) {
.header-inner { width: calc(100% - 32px); }
.nav, .header-cta { display: none; }
.menu-btn { display: flex; }
.nav.open {
display: flex;
position: absolute;
top: 76px;
left: 12px;
right: 12px;
flex-direction: column;
gap: 4px;
background: rgba(255, 255, 255, .98);
border: 1px solid rgba(0, 0, 0, .1);
border-radius: 20px;
padding: 12px;
box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
}
.nav.open a {
width: 100%;
min-height: 44px;
display: flex;
align-items: center;
padding: 10px 16px;
font-size: 14px;
border-radius: 12px;
color: #1f2937;
}
.nav.open a:hover,
.nav.open a.active {
background: rgba(8, 123, 112, .08);
color: #087b70;
}
}
@media(max-width:600px) {
.site-header { height: 68px; }
.nav.open { top: 68px; }
.brand-word { font-size: 24px; }
.brand-mark { width: 32px; height: 32px; }
}
@media(prefers-reduced-motion:reduce) {
.site-header { transition: transform .01s linear!important; }
}
</style>
